name: Push specific files to another repo

on:
  workflow_dispatch: # Creates the "Run workflow" button in the Actions tab

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Stage files and folders listed in include.json
        run: |
          mkdir -p _staging
          jq -r '.[] | sub("/$"; "")' include.json | while IFS= read -r item; do
            if [ -e "$item" ]; then
              mkdir -p "_staging/$(dirname "$item")"
              cp -r "$item" "_staging/$item"
              echo "Staged: $item"
            else
              echo "Warning: '$item' not found, skipping."
            fi
          done

      - name: Push staged files to target repo
        env:
          GH_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          export GH_TOKEN=$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')
          gh auth setup-git

          gh repo clone sdev-org/sdev _target
          cp -r _staging/. _target/

          cd _target
          git config user.name "sava34301"
          git config user.email "milanov.sava22@gmail.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to push."
          else
            git commit -m "Sync new files from SDEV repository."
            git push -u origin HEAD:main
          fi
